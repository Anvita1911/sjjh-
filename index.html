!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sea Turtle Conservation</title>
  <style>
    /* Styles unchanged */
  </style>
</head>
<body>
  <header>
    <h1>Save the Sea Turtles</h1>
    <nav>
      <button onclick="showSection('species')">Species</button>
      <button onclick="showSection('threats')">Threats</button>
      <button onclick="showSection('conservation')">Conservation</button>
      <button onclick="showSection('help')">How You Can Help</button>
      <button onclick="showSection('quiz')">Turtle Quiz!</button>
    </nav>
  </header>

  <main>
    <section id="species" class="active">
      <h2>Sea Turtle Species</h2>
      <ul>…</ul>
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1350&q=80" alt="Sea Turtle swimming" />
    </section>

    <section id="threats">
      <h2>Threats They Face</h2>
      <ul>…</ul>
      <img src="https://images.unsplash.com/photo-1617957749136-13e99e54f8a2?auto=format&fit=crop&w=1350&q=80" alt="Plastic pollution and turtle" />
    </section>

    <section id="conservation">
      <h2>Conservation Efforts</h2>
      <ul>…</ul>
      <img src="https://images.unsplash.com/photo-1576698481060-cd30ba9f3c4c?auto=format&fit=crop&w=1350&q=80" alt="Turtle being tagged" />
    </section>

    <section id="help">
      <h2>How You Can Help</h2>
      <ul>…</ul>
      <img src="https://images.unsplash.com/photos/a-sea-turtle-swims-in-green-water-kvME5G9RpVk?auto=format&fit=crop&w=1350&q=80" alt="Sea turtle in clear water" />
      <!-- Image choice based on Unsplash search :contentReference[oaicite:1]{index=1} -->
    </section>

    <section id="quiz">
      <h2>Turtle Quiz!</h2>
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSevcTSVleLpuyA3CY_o5je9L1P5v-C2RkRf9EoEwqI93TuxZg/viewform?embedded=true"
        width="100%" height="800" frameborder="0" marginheight="0" marginwidth="0">
        Loading…
      </iframe>
    </section>
  </main>

  <footer>Sea Turtle Awareness Project © 2025</footer>

  <script>
    function showSection(id) {
      document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      window.scrollTo({top:0, behavior:"smooth"});
    }
  </script>
</body>
</html>
